# Measured MID360 height in the normal navigation stance. The wrapper rejects
# startup values outside 0.43-0.59 m so a wrong stance/extrinsic is not hidden.
sensor_height: 0.51

verbose: false
visualize: false

num_iter: 3
num_lpr: 20
num_min_pts: 8
th_seeds: 0.15
th_dist: 0.10
th_seeds_v: 0.12
th_dist_v: 0.10

min_r: 0.35
max_r: 8.0
# cos(35 deg), aligned with the approved maximum connected slope.
uprightness_thr: 0.819152044
adaptive_seed_selection_margin: -1.2

czm:
  num_zones: 4
  num_sectors_each_zone: [16, 32, 54, 32]
  mum_rings_each_zone: [2, 4, 4, 4]
  elevation_thresholds: [0.0, 0.0, 0.0, 0.0]
  flatness_thresholds: [0.0, 0.0, 0.0, 0.0]

enable_RNR: true
enable_RVPF: true
enable_TGR: true
RNR_ver_angle_thr: -15.0
RNR_intensity_thr: 0.2
