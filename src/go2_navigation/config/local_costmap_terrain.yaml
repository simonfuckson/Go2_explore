global_frame: odom
robot_base_frame: base_link
update_frequency: 8.0
publish_frequency: 4.0
transform_tolerance: 0.30
rolling_window: true
width: 6.0
height: 6.0
resolution: 0.05
plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
obstacle_layer:
  enabled: true
  footprint_clearing_enabled: true
  combination_method: 1
  observation_sources: terrain_marking terrain_clearing
  terrain_marking:
    topic: /terrain/obstacle_points
    sensor_frame: terrain_sensor
    data_type: PointCloud2
    marking: true
    clearing: false
    # Height selection is already ground-relative in go2_terrain. Wide limits
    # here keep navigation valid when odom z changes on a ramp.
    min_obstacle_height: -5.0
    max_obstacle_height: 5.0
    obstacle_range: 4.0
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.0
  terrain_clearing:
    topic: /terrain/clearing_points
    sensor_frame: terrain_sensor
    data_type: PointCloud2
    marking: false
    clearing: true
    min_obstacle_height: -5.0
    max_obstacle_height: 5.0
    obstacle_range: 4.0
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.0
inflation_layer:
  inflation_radius: 0.10
  cost_scaling_factor: 4.0
