base_global_planner: global_planner/GlobalPlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS
planner_frequency: 1.0
planner_patience: 8.0
controller_frequency: 8.0
controller_patience: 4.0
recovery_behavior_enabled: true
clearing_rotation_allowed: false
# GO2 low-speed walking may not translate 0.15 m within five seconds even
# though it is making valid progress.  Use a smaller progress distance and a
# longer observation window to avoid false ABORTED results.
oscillation_timeout: 20.0
oscillation_distance: 0.08
shutdown_costmaps: false

# Clear only the rolling local obstacle layer.  No recovery rotation is used,
# so an infeasible TEB trajectory can be retried without dragging the feet.
recovery_behaviors:
  - name: clear_dynamic_obstacles
    type: clear_costmap_recovery/ClearCostmapRecovery

clear_dynamic_obstacles:
  reset_distance: 0.0
  affected_maps: local
  layer_names:
    - obstacle_layer
