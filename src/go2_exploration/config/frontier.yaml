robot_base_frame: base_link
# Task map contains traditional unknown borders AND unobserved ground gaps.
# BFS traversability and path checks use the real collision geometry below.
costmap_topic: /exploration/frontier_map
costmap_updates_topic: /exploration/frontier_map_updates
geometry:
  costmap_topic: /move_base/global_costmap/costmap
  costmap_updates_topic: /move_base/global_costmap/costmap_updates
  robot_base_frame: base_link
  transform_tolerance: 0.5
local_geometry:
  costmap_topic: /move_base/local_costmap/costmap
  costmap_updates_topic: /move_base/local_costmap/costmap_updates
  robot_base_frame: base_link
  transform_tolerance: 0.5
visualize: true
planner_frequency: 1.0
progress_timeout: 30.0
potential_scale: 0.001
orientation_scale: 0.0
gain_scale: 1.0
transform_tolerance: 0.5
min_frontier_size: 0.50
minimum_goal_distance: 0.40
# Height and pitch are read from GO2 terrain/extrinsics; prediction never clears cells.
view_range: 3.0
plan_checks_per_cycle: 12
# Soft wall-time budget between candidates; a ROS service call may exceed it.
selection_budget_ms: 75.0
# Information gain / estimated travel + turn + goal-handshake time.
goal_overhead_seconds: 2.0
candidate_retry_seconds: 15.0
failed_goal_retry_seconds: 30.0
